title: Frequently Asked Questions
version: 2026-11
faqs:
  - q: Is breakfast included?
    a: Breakfast is not included in the room rate. The buffet runs from 07:00 to 10:30 and costs 18 USD per adult and 9 USD per child under 12.
  - q: Do you have parking?
    a: Yes. On-site parking costs 15 USD per night and includes two electric-vehicle chargers. Spaces cannot be reserved in advance.
  - q: Is there wifi?
    a: Fast wifi is free in all rooms and public areas.
  - q: Do you offer airport transfers?
    a: Yes. A private airport transfer costs 45 USD each way and must be booked at least 24 hours before arrival.
  - q: What are the pool and gym hours?
    a: The outdoor pool is open from 07:00 to 21:00. The gym is open 24 hours with your room key.
  - q: Which payment methods do you accept?
    a: We accept Visa, Mastercard and American Express. Payment is taken through a secure payment link; never send card numbers in a chat or email.
  - q: How can I contact the front desk?
    a: The front desk is staffed 24 hours. Email frontdesk@aurora-bay.example or call +1 555 0100.
  - q: Can I store luggage before check-in or after check-out?
    a: Yes, luggage storage at the front desk is free on your arrival and departure days.
  - q: Do you have a restaurant?
    a: The Tidewater restaurant serves dinner from 18:00 to 22:00 daily. Room service is available from 07:00 to 23:00.
