apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "concierge.name" . }}-gateway
  labels: {{- include "concierge.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicas }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
  template:
    metadata:
      labels: {{- include "concierge.labels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["uvicorn", "channels.gateway:app", "--host", "0.0.0.0", "--port", "{{ .Values.gateway.port }}", "--proxy-headers"]
          ports: [{name: http, containerPort: {{ .Values.gateway.port }}}]
          envFrom: {{- include "concierge.envFrom" . | nindent 12 }}
          env: {{- include "concierge.env" . | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 15, periodSeconds: 10}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: false}
          volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "concierge.name" . }}-gateway
  labels: {{- include "concierge.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
  ports: [{name: http, port: 80, targetPort: http}]
{{- if .Values.gateway.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "concierge.name" . }}-gateway
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "concierge.name" . }}-gateway}
  minReplicas: {{ .Values.gateway.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.gateway.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: {{ .Values.gateway.autoscaling.targetCPU }}}}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "concierge.name" . }}-gateway
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: gateway}
{{- end }}
