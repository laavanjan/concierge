# Live-model evaluation against Claude. Manual or weekly: it costs real API money, so it is not run on every PR.
name: eval-live

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "golden conversations to run (cost control)"
        default: "30"
  schedule:
    - cron: "0 5 * * 1"

jobs:
  live:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -e ".[dev]"
      - name: Live suites (Claude agents + LLM judge)
        run: python -m evals.run --suite all --mode live --limit "${{ github.event.inputs.limit || '30' }}" --out evals/reports/live.json
      - name: Gate
        run: python -m evals.gate evals/reports/live.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: live-eval-report, path: evals/reports/live.json}
